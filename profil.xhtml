<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>Profil Pengguna - CampusSpace</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" type="text/css" href="CSS/profil.css" />
</head>
<body>
<div class="kotak">
    <h1>Profil Pengguna</h1>

    <!-- PESAN_START -->
    <p class="notifikasi {{KELAS_PESAN}}">{{PESAN}}</p>
    <!-- PESAN_END -->

    <div class="info-akun">
        <div class="header-profil">
            <img id="preview-foto-profil"
                 src="{{FOTO_PROFIL}}"
                 alt="Foto Profil {{NAMA_LENGKAP}}"
                 class="avatar-profil" />
            <div class="detail-akun">
                <p class="nama-akun-tampil">{{NAMA_LENGKAP}}</p>
                <p><strong>Email:</strong> {{EMAIL}}</p>
                <p><strong>Peran:</strong> {{PERAN}}</p>
            </div>
        </div>
    </div>

    <form method="post" action="profil.php" enctype="multipart/form-data">
        <input type="hidden"
               name="csrf_token"
               value="{{CSRF_TOKEN}}" />

        <label for="foto_profil">Foto Profil (JPG, PNG, WEBP — Maks. 2 MB)</label>
        <input type="file"
               id="foto_profil"
               name="foto_profil"
               accept="image/jpeg,image/png,image/webp" />
        <small id="info-foto-profil" class="petunjuk-input">Pilih gambar untuk menambahkan atau mengganti foto profil.</small>

        <!-- HAPUS_FOTO_START -->
        <div class="opsi-hapus-foto">
            <input type="checkbox" id="hapus_foto" name="hapus_foto" value="1" />
            <label for="hapus_foto">Hapus foto profil saat ini</label>
        </div>
        <!-- HAPUS_FOTO_END -->

        <label for="nama">Nama Lengkap</label>
        <input type="text"
               id="nama"
               name="nama_lengkap"
               maxlength="100"
               value="{{NAMA_LENGKAP}}"
               required="required" />

        <label for="identitas">Nomor Identitas / NPM</label>
        <input type="text"
               id="identitas"
               name="nomor_identitas"
               maxlength="30"
               value="{{NOMOR_IDENTITAS}}" />

        <label for="telepon">Nomor Telepon</label>
        <input type="text"
               id="telepon"
               name="no_telepon"
               maxlength="20"
               value="{{NO_TELEPON}}" />

        <button type="submit">Simpan Perubahan</button>
    </form>

    <p class="bawah">
        <a href="dashboard.php">Kembali ke Dashboard</a>
    </p>
</div>
<script src="JS/auth.js"></script>
</body>
</html>
