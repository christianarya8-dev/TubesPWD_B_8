<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>Pinjam Ruangan - CampusSpace</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" type="text/css" href="CSS/pinjam_ruangan.css" />
</head>
<body>

<div class="kotak">
    <h1>Form Peminjaman Ruangan</h1>

    <!-- PESAN_START -->
    <p class="pesan {{KELAS_PESAN}}">{{PESAN}}</p>
    <!-- PESAN_END -->

    <form method="post" action="pinjam_ruangan.php">
        <input type="hidden"
               name="csrf_token"
               value="{{CSRF_TOKEN}}" />

        <label for="ruangan">Pilih Ruangan</label>
        <select id="ruangan"
                name="id_ruangan"
                required="required">
            <option value="">-- Pilih Ruangan --</option>
            {{OPSI_RUANGAN}}
        </select>

        <label for="tanggal">Tanggal Peminjaman</label>
        <input type="date"
               id="tanggal"
               name="tanggal"
               min="{{TANGGAL_MIN}}"
               value="{{TANGGAL_LAMA}}"
               required="required" />

        <label for="mulai">Jam Mulai</label>
        <input type="time"
               id="mulai"
               name="jam_mulai"
               value="{{MULAI_LAMA}}"
               required="required" />

        <label for="selesai">Jam Selesai</label>
        <input type="time"
               id="selesai"
               name="jam_selesai"
               value="{{SELESAI_LAMA}}"
               required="required" />

        <label for="keperluan">Keperluan</label>
        <textarea id="keperluan"
                  name="keperluan"
                  rows="3"
                  cols="40"
                  maxlength="255"
                  required="required">{{KEPERLUAN_LAMA}}</textarea>

        <label for="peserta">Jumlah Peserta</label>
        <input type="number"
               id="peserta"
               name="jumlah_peserta"
               min="1"
               value="{{PESERTA_LAMA}}"
               required="required" />

        <button type="submit">Ajukan Peminjaman</button>
    </form>

    <div class="bawah">
        <a href="dashboard.php">Kembali ke Dashboard</a>
        <a href="riwayat_peminjaman.php">Lihat Riwayat Peminjaman</a>
    </div>
</div>

<script src="JS/index.js"></script>
</body>
</html>
