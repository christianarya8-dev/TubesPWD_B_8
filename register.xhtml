<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>Registrasi - CampusSpace</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" type="text/css" href="CSS/register.css" />
</head>

<body>
<div class="kotak">

    <h1>CampusSpace</h1>
    <h2>Daftar Akun Mahasiswa</h2>

    <!-- PESAN_START -->
    <p class="pesan">{{PESAN}}</p>
    <!-- PESAN_END -->

    <form action="register.php" method="post">

        <input type="hidden"
               name="csrf_token"
               value="{{CSRF_TOKEN}}" />

        <label for="nama">Nama Lengkap</label>
        <input type="text"
               id="nama"
               name="nama_lengkap"
               maxlength="100"
               value="{{NAMA_LAMA}}"
               required="required" />

        <label for="email">Email</label>
        <input type="email"
               id="email"
               name="email"
               maxlength="150"
               value="{{EMAIL_LAMA}}"
               required="required" />

        <label for="sandi">Password</label>
        <input type="password"
               id="sandi"
               name="kata_sandi"
               minlength="8"
               required="required" />

        <label for="konfirmasi">Konfirmasi Password</label>
        <input type="password"
               id="konfirmasi"
               name="konfirmasi_sandi"
               minlength="8"
               required="required" />

        <button type="submit">Daftar Sekarang</button>
    </form>

    <p class="bawah">
        Sudah punya akun?
        <a href="login.php">Login</a>
    </p>

</div>
<script src="JS/auth.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
