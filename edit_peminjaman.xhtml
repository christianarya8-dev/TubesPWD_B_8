<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>Edit Peminjaman - CampusSpace</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" type="text/css" href="CSS/edit_peminjaman.css" />
</head>
<body>
<div class="kotak">
    <h1>Edit Peminjaman</h1>

    <div class="info-ruangan">
        <p><strong>Ruangan:</strong> {{NAMA_RUANGAN}}</p>
        <p><strong>Kapasitas:</strong> {{KAPASITAS}} orang</p>
    </div>

    <!-- PESAN_START -->
    <p class="error">{{PESAN}}</p>
    <!-- PESAN_END -->

    <form method="post" action="edit_peminjaman.php?id={{ID_PEMINJAMAN}}">
        <input type="hidden"
               name="csrf_token"
               value="{{CSRF_TOKEN}}" />

        <label for="tanggal">Tanggal Peminjaman</label>
        <input type="date"
               id="tanggal"
               name="tanggal"
               min="{{TANGGAL_MIN}}"
               value="{{TANGGAL}}"
               required="required" />

        <label for="mulai">Jam Mulai</label>
        <input type="time"
               id="mulai"
               name="jam_mulai"
               value="{{JAM_MULAI}}"
               required="required" />

        <label for="selesai">Jam Selesai</label>
        <input type="time"
               id="selesai"
               name="jam_selesai"
               value="{{JAM_SELESAI}}"
               required="required" />

        <label for="keperluan">Keperluan</label>
        <textarea id="keperluan"
                  name="keperluan"
                  rows="3"
                  cols="40"
                  maxlength="255"
                  required="required">{{KEPERLUAN}}</textarea>

        <label for="peserta">Jumlah Peserta</label>
        <input type="number"
               id="peserta"
               name="jumlah_peserta"
               min="1"
               max="{{KAPASITAS}}"
               value="{{JUMLAH_PESERTA}}"
               required="required" />

        <button type="submit">Simpan Perubahan</button>
    </form>

    <p class="bawah">
        <a href="riwayat_peminjaman.php">Kembali ke Riwayat</a>
    </p>
</div>
<script src="JS/index.js"></script>
</body>
</html>
